<div class="mt-3 row space-between">
  <h4 class="col">Stock Records</h4>
  <p-button 
    icon="pi pi-plus" 
    label="Add Price" 
    class="mb-3 col text-end" 
    (click)="addPrice()">
  </p-button>
</div>

<p-table [value]="stockRecords" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template pTemplate="header">
    <tr>
      <th>Product</th>
      <th>Quantity</th>
      <th class="text-center">Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-record>
    <tr>
      <td>{{ record.productDto?.name || 'Unknown' }}</td>
      <td>{{ record.quantity }}</td>
      <td class="text-center">
        <p-button icon="pi pi-pencil" styleClass="p-button-sm p-button-rounded p-button-text mr-2" (click)="editPrice(record)"></p-button>
        <p-button icon="pi pi-trash" styleClass="p-button-sm p-button-rounded p-button-danger p-button-text" (click)="deletePrice(record)"></p-button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-create-or-edit-stock-record
  [visible]="drawerVisible"
  [stockRecord]="selectedRecord"
  [allProducts]="allProducts"
  [existingStocks]="stockRecords"
  (save)="handleSave()"
  (close)="drawerVisible = false"
></app-create-or-edit-stock-record>

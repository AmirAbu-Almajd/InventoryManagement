<div class="mt-3 row space-between">
  <h4 class="col">Product Prices</h4>
  <p-button 
    icon="pi pi-plus" 
    label="Add Price" 
    class="mb-3 col text-end" 
    (click)="addPrice()">
  </p-button>
</div>

<p-table [value]="productPrices" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template pTemplate="header">
    <tr>
      <th>Product</th>
      <th>Price</th>
      <th class="text-center">Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-price>
    <tr>
      <td>{{ price.productDto?.name || 'Unknown' }}</td>
      <td>{{ price.price }}</td>
      <td class="text-center">
        <p-button icon="pi pi-pencil" styleClass="p-button-sm p-button-rounded p-button-text mr-2" (click)="editPrice(price)"></p-button>
        <p-button icon="pi pi-trash" styleClass="p-button-sm p-button-rounded p-button-danger p-button-text" (click)="deletePrice(price)"></p-button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-create-or-edit-product-price
  [visible]="drawerVisible"
  [productPrice]="selectedPrice"
  [allProducts]="allProducts"
  [existingPrices]="productPrices"
  (save)="handleSave()"
  (close)="drawerVisible = false"
></app-create-or-edit-product-price>

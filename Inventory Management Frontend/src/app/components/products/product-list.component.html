<div class="mt-3 row space-between">
  <h4 class="col">Products</h4>
  <p-button 
    icon="pi pi-plus" 
    label="Add Product" 
    class="mb-3 col text-end" 
    (click)="addProduct()">
  </p-button>
</div>

<p-table [value]="products" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template pTemplate="header">
      <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Description</th>
          <th class="text-center">Actions</th>
      </tr>
  </ng-template>
  <ng-template pTemplate="body" let-product>
      <tr>
          <td>{{ product.code }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.description }}</td>
          <td class="text-center">
              <p-button 
                icon="pi pi-pencil" 
                styleClass="p-button-sm p-button-rounded p-button-text mr-2"
                (click)="editProduct(product)">
              </p-button>
              
              <p-button 
                icon="pi pi-trash" 
                styleClass="p-button-sm p-button-rounded p-button-danger p-button-text"
                (click)="deleteProduct(product)">
              </p-button>
          </td>
      </tr>
  </ng-template>
</p-table>

<app-create-or-edit-product
  [visible]="drawerVisible"
  [product]="selectedProduct"
  (save)="handleSave()"
  (close)="drawerVisible = false"
></app-create-or-edit-product>
